name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5️⃣ Create auth.json from secret
      - name: Create Playwright auth state
        run: echo '${{ secrets.PLAYWRIGHT_AUTH_STATE }}' > auth.json

      # 6️⃣ Run Playwright tests
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_AUTH_FILE: auth.json
        run: npx playwright test || true
       # 7️⃣ Write Allure Environment Properties
      - name: Write Allure environment.properties
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Browser=Chromium
          Browser.Version=$(npx playwright --version | grep -oP '\d+\.\d+\.\d+' || echo "latest")
          Node.Version=$(node --version)
          OS=${{ runner.os }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Triggered.By=${{ github.actor }}
          Run.ID=${{ github.run_id }}
          EOF

      # 7️⃣ Generate Allure Report (Fresh Every Time)
      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      # 8️⃣ Upload Allure Report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      # 9️⃣ Upload Playwright Report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      # 🔟 Deploy Allure Report to GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report